apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// The ABIs the app is building for. Must match react-native-nitro-modules (which
// filters the same way) — otherwise this module builds an ABI Nitro didn't, and
// its .so fails to link the missing libNitroModules.so.
def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

// In the monorepo the shared Kotlin engine + renderer is compiled from source
// (fast iteration, no publish needed). Installed from npm those paths don't
// exist, so we depend on the published Maven artifact instead (see dependencies).
def livelineSrc = file("../../../android/liveline/src/main/kotlin")
def useLocalSource = livelineSrc.exists()

android {
  namespace "com.liveline.mobile"
  compileSdk safeExtGet("compileSdkVersion", 36)
  ndkVersion safeExtGet("ndkVersion", "27.1.12297006")

  defaultConfig {
    minSdk safeExtGet("minSdkVersion", 24)
    ndk {
      abiFilters (*reactNativeArchitectures())
    }
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all -std=c++20"
        arguments "-DANDROID_STL=c++_shared"
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
    buildConfig true
  }

  if (useLocalSource) {
    sourceSets {
      main {
        java.srcDirs += ["../../../android/liveline/src/main/kotlin"]
      }
    }
  }
}

// Adds the Nitrogen-generated Kotlin sources.
apply from: "../nitrogen/generated/android/LivelineMobile+autolinking.gradle"

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")

  // Published install: pull the engine + renderer from Maven Central at the
  // matching version (single source of truth: this package's package.json).
  if (!useLocalSource) {
    def pkg = new groovy.json.JsonSlurper().parseText(file("../package.json").text)
    implementation "io.github.lewiscasewell:liveline:${pkg.version}"
  }
}
